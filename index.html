<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Trò chơi Tìm Hình Tam Giác & Tứ Giác</title>
    <!-- Sử dụng Tailwind CSS cho giao diện -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Thư viện Confetti cho hiệu ứng chúc mừng -->
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
    <!-- YouTube IFrame API -->
    <script src="https://www.youtube.com/iframe_api"></script>
    <!-- Font chữ vui nhộn phù hợp học sinh -->
    <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;700;900&display=swap" rel="stylesheet">
    
    <style>
        body {
            font-family: 'Nunito', sans-serif;
            background-color: #f0f9ff; /* Màu xanh nhạt tươi sáng */
            background-image: url('data:image/svg+xml,%3Csvg width="60" height="60" viewBox="0 0 60 60" xmlns="http://www.w3.org/2000/svg"%3E%3Cg fill="none" fill-rule="evenodd"%3E%3Cg fill="%23bae6fd" fill-opacity="0.4"%3E%3Cpath d="M36 34v-4h-2v4h-4v2h4v4h2v-4h4v-2h-4zm0-30V0h-2v4h-4v2h4v4h2V6h4V4h-4zM6 34v-4H4v4H0v2h4v4h2v-4h4v-2H6zM6 4V0H4v4H0v2h4v4h2V6h4V4H6z"/%3E%3C/g%3E%3C/g%3E%3C/svg%3E');
        }
        
        .pop-animation {
            animation: pop 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards;
        }

        @keyframes pop {
            0% { transform: scale(0.8); opacity: 0; }
            100% { transform: scale(1); opacity: 1; }
        }

        .shake-animation {
            animation: shake 0.4s cubic-bezier(.36,.07,.19,.97) both;
        }

        @keyframes shake {
            10%, 90% { transform: translate3d(-1px, 0, 0); }
            20%, 80% { transform: translate3d(2px, 0, 0); }
            30%, 50%, 70% { transform: translate3d(-4px, 0, 0); }
            40%, 60% { transform: translate3d(4px, 0, 0); }
        }

        /* Ẩn màn hình lúc đầu */
        .hidden-screen {
            display: none;
        }
    </style>
</head>
<body class="min-h-screen flex items-center justify-center p-4 text-slate-800">

    <!-- Div ẩn chứa YouTube Iframe -->
    <div id="youtube-player" style="display:none;"></div>

    <!-- MODAL CÀI ĐẶT (Dành cho Giáo viên) -->
    <div id="settingsModal" class="hidden fixed inset-0 bg-slate-900/50 backdrop-blur-sm z-50 flex items-center justify-center p-4">
        <div class="bg-white rounded-3xl shadow-2xl p-8 max-w-2xl w-full border-4 border-sky-300 pop-animation relative max-h-[95vh] overflow-y-auto">
            <button onclick="closeSettings()" class="absolute top-4 right-4 w-10 h-10 bg-slate-100 hover:bg-red-100 text-slate-500 hover:text-red-500 rounded-full text-2xl font-bold flex items-center justify-center transition-colors">&times;</button>
            <h1 class="text-3xl md:text-4xl font-black text-sky-600 mb-2 text-center">⚙️ Cài Đặt Trò Chơi</h1>
            <p class="text-center text-slate-500 mb-6">Giáo viên tải ảnh bài toán và cập nhật đáp án tại đây.</p>

            <div class="space-y-5">
                <div class="bg-sky-50 p-4 rounded-2xl border-2 border-sky-100">
                    <label class="block text-xl font-bold text-sky-600 mb-2">🖼️ Tải lên ảnh bài toán:</label>
                    <p class="text-sm text-slate-500 mb-2">Chọn file ảnh (jpg, png...) từ máy tính của bạn.</p>
                    <input type="file" id="imageUpload" accept="image/*" 
                        class="w-full text-lg p-2 rounded-xl bg-white border-2 border-sky-200 file:mr-4 file:py-2 file:px-4 file:rounded-full file:border-0 file:text-sm file:font-bold file:bg-sky-50 file:text-sky-700 hover:file:bg-sky-100 cursor-pointer">
                </div>

                <div class="bg-amber-50 p-4 rounded-2xl border-2 border-amber-100">
                    <label class="block text-xl font-bold text-amber-500 mb-2">🔺 Các hình Tam Giác đúng:</label>
                    <p class="text-sm text-slate-500 mb-2">Cách nhau bởi dấu phẩy (,)</p>
                    <input type="text" id="setupTriangles" value="ADC, ABC, BCE" 
                        class="w-full text-xl p-3 rounded-xl border-2 border-amber-200 focus:border-amber-400 focus:outline-none transition-colors">
                </div>

                <div class="bg-emerald-50 p-4 rounded-2xl border-2 border-emerald-100">
                    <label class="block text-xl font-bold text-emerald-500 mb-2">🟦 Các hình Tứ Giác đúng:</label>
                    <p class="text-sm text-slate-500 mb-2">Cách nhau bởi dấu phẩy (,)</p>
                    <input type="text" id="setupQuads" value="ABCD, ABCE, ADEB" 
                        class="w-full text-xl p-3 rounded-xl border-2 border-emerald-200 focus:border-emerald-400 focus:outline-none transition-colors">
                </div>

                <div class="flex flex-col sm:flex-row gap-4 mt-4">
                    <button onclick="restoreDefaults()" 
                        class="w-full sm:w-1/3 bg-slate-200 hover:bg-slate-300 text-slate-700 text-lg font-bold py-4 px-4 rounded-xl shadow-[0_4px_0_0_#94a3b8] active:shadow-none active:translate-y-1 transition-all">
                        Khôi phục gốc
                    </button>
                    <button onclick="saveSettings()" 
                        class="w-full sm:w-2/3 bg-sky-500 hover:bg-sky-600 text-white text-xl md:text-2xl font-bold py-4 px-8 rounded-xl shadow-[0_6px_0_0_#0284c7] active:shadow-none active:translate-y-1 transition-all">
                        Lưu & Cập Nhật! 🚀
                    </button>
                </div>
            </div>
        </div>
    </div>

    <!-- MÀN HÌNH TRÒ CHƠI (Trình chiếu cho Học sinh) -->
    <div id="playScreen" class="bg-white rounded-3xl shadow-2xl overflow-hidden w-full max-w-5xl border-4 border-amber-300 relative z-10">
        
        <!-- Header -->
        <div class="bg-amber-100 p-4 flex justify-between items-center border-b-4 border-amber-200">
            <h1 class="text-3xl font-black text-amber-600">Trò Chơi Tìm Hình 🔍</h1>
            <div class="flex gap-3 items-center">
                <button id="musicToggleBtn" onclick="toggleMusic()" class="text-sm bg-pink-500 hover:bg-pink-600 text-white font-bold py-2 px-4 rounded-xl shadow-[0_4px_0_0_#be185d] active:shadow-none active:translate-y-1 transition-all flex items-center gap-2">
                    🔇 Nhạc nền
                </button>
                <button onclick="openSettings()" class="text-sm bg-sky-500 hover:bg-sky-600 text-white font-bold py-2 px-4 rounded-xl shadow-[0_4px_0_0_#0284c7] active:shadow-none active:translate-y-1 transition-all flex items-center gap-2">
                    ⚙️ Cài đặt
                </button>
            </div>
        </div>

        <div class="flex flex-col md:flex-row p-6 gap-6">
            
            <!-- Khu vực Hình ảnh và Nhập liệu -->
            <div class="flex-1 flex flex-col items-center">
                
                <!-- Hình ảnh minh họa bài toán -->
                <div class="w-full bg-slate-50 rounded-2xl border-2 border-slate-200 p-2 mb-6 shadow-inner flex justify-center items-center relative overflow-hidden group min-h-[250px]">
                     <!-- Dùng id="gameImage" để cập nhật hình khi load ảnh mới -->
                    <img id="gameImage" src="image_d2dabc.jpg" alt="Hình bài toán" 
                         onerror="this.onerror=null; this.src='https://placehold.co/800x400/fffbeb/d97706?text=Ch%C6%B0a+c%C3%B3+%E1%BA%A3nh+b%C3%A0i+to%C3%A1n';"
                         class="max-h-[350px] object-contain rounded-xl">
                </div>

                <!-- Khu vực chat / nhập đáp án -->
                <div class="w-full bg-sky-50 p-6 rounded-2xl border-2 border-sky-200 shadow-md">
                    <label class="block text-center text-xl font-bold text-sky-700 mb-4">
                        🎤 Các bạn nhỏ tìm được hình nào? Đọc to lên nào!
                    </label>
                    <div class="flex gap-4">
                        <input type="text" id="answerInput" 
                            class="flex-1 text-3xl font-black text-center text-slate-700 uppercase p-4 rounded-xl border-4 border-sky-300 focus:border-sky-500 focus:outline-none transition-colors"
                            autocomplete="off">
                        <button onclick="checkAnswer()" id="checkBtn"
                            class="bg-emerald-500 hover:bg-emerald-600 text-white text-xl font-bold py-4 px-8 rounded-xl shadow-[0_6px_0_0_#059669] active:shadow-none active:translate-y-1 transition-all">
                            Kiểm tra
                        </button>
                    </div>
                </div>

                <!-- Khu vực Thông báo Kết quả -->
                <div id="feedbackArea" class="mt-6 h-20 flex items-center justify-center w-full">
                    <!-- Text thông báo sẽ hiển thị ở đây -->
                </div>
            </div>

            <!-- Khu vực Danh sách kết quả -->
            <div class="w-full md:w-1/3 flex flex-col gap-4">
                <!-- Danh sách Tam Giác -->
                <div class="bg-amber-50 p-4 rounded-2xl border-2 border-amber-200 flex-1 shadow-sm">
                    <h2 class="text-xl font-bold text-amber-600 mb-3 border-b-2 border-amber-200 pb-2">
                        🔺 Tam giác đã tìm (<span id="countTriangles">0</span>)
                    </h2>
                    <div id="foundTrianglesList" class="flex flex-wrap gap-2">
                        <!-- Thêm badge vào đây -->
                    </div>
                </div>

                <!-- Danh sách Tứ Giác -->
                <div class="bg-emerald-50 p-4 rounded-2xl border-2 border-emerald-200 flex-1 shadow-sm">
                    <h2 class="text-xl font-bold text-emerald-600 mb-3 border-b-2 border-emerald-200 pb-2">
                        🟦 Tứ giác đã tìm (<span id="countQuads">0</span>)
                    </h2>
                    <div id="foundQuadsList" class="flex flex-wrap gap-2">
                         <!-- Thêm badge vào đây -->
                    </div>
                </div>
            </div>
            
        </div>
    </div>

    <!-- Script Xử lý Logic -->
    <script>
        // --- CẤU TRÚC DỮ LIỆU ---
        const DEFAULT_IMAGE = 'image_d2dabc.jpg';
        const DEFAULT_TRIANGLES = 'ADC, ABC, BCE';
        const DEFAULT_QUADS = 'ABCD, ABCE, ADEB';

        let expectedAnswers = {}; // Map lưu chuẩn hóa chuỗi -> chuỗi gốc giáo viên nhập
        let answerTypes = {};     // Map lưu chuẩn hóa chuỗi -> loại hình ('triangle' hoặc 'quad')
        let foundAnswers = new Set(); // Set lưu các hình đã tìm thấy (dạng chuẩn hóa)

        // --- HÀM TIỆN ÍCH ---

        // Hàm chuẩn hóa chuỗi: 
        // - Tam giác (3 chữ cái): Sắp xếp theo thứ tự bảng chữ cái (ví dụ: ACB -> ABC)
        // - Tứ giác (4 chữ cái): Tạo các chuỗi xoay vòng (thuận & nghịch) và lấy chuỗi nhỏ nhất theo từ điển
        function getCanonicalName(str) {
            str = str.toUpperCase().replace(/[^A-Z]/g, '');
            if (str.length === 3) {
                // Tam giác: thứ tự nào cũng giống nhau
                return str.split('').sort().join('');
            } else if (str.length >= 4) {
                // Tứ giác: Phải theo vòng (chiều kim đồng hồ hoặc ngược chiều)
                let rotations = [];
                let rev = str.split('').reverse().join(''); // Chiều ngược lại
                for (let i = 0; i < str.length; i++) {
                    rotations.push(str.substring(i) + str.substring(0, i));
                    rotations.push(rev.substring(i) + rev.substring(0, i));
                }
                // Sắp xếp và lấy chuỗi đầu tiên làm tên chuẩn (Canonical Name)
        // Giúp ABCD, BCDA, DCBA đều quy về chung 1 mã, trong khi ACBD sẽ ra mã khác.
        rotations.sort();
        return rotations[0];
    }
    return str.split('').sort().join('');
}

// --- YOUTUBE NHẠC NỀN ---
let ytPlayer;
let isMusicPlaying = false;

// Hàm này được YouTube API gọi tự động khi thư viện đã tải xong
function onYouTubeIframeAPIReady() {
    ytPlayer = new YT.Player('youtube-player', {
        height: '0',
        width: '0',
        videoId: 'XeqtA91kdCI',
        playerVars: {
            'autoplay': 0,
            'controls': 0,
            'loop': 1,
            'playlist': 'XeqtA91kdCI' // Bắt buộc phải có playlist để lặp lại 1 video
        },
        events: {
            'onReady': onPlayerReady,
            'onStateChange': onPlayerStateChange
        }
    });
}

function onPlayerReady(event) {
    event.target.setVolume(30); // Đặt âm lượng 30% để không quá ồn
}

function onPlayerStateChange(event) {
    const btn = document.getElementById('musicToggleBtn');
    if (event.data == YT.PlayerState.PLAYING) {
        isMusicPlaying = true;
        btn.innerHTML = '🎵 Nhạc nền';
        btn.classList.remove('bg-pink-500');
        btn.classList.add('bg-pink-400');
    } else if (event.data == YT.PlayerState.PAUSED || event.data == YT.PlayerState.ENDED) {
        isMusicPlaying = false;
        btn.innerHTML = '🔇 Nhạc nền';
        btn.classList.remove('bg-pink-400');
        btn.classList.add('bg-pink-500');
    }
}

function toggleMusic() {
    const btn = document.getElementById('musicToggleBtn');
    
    // Kiểm tra xem YT Player đã khởi tạo xong chưa
    if (!ytPlayer || typeof ytPlayer.playVideo !== 'function') {
        showFeedback("Nhạc nền đang tải, vui lòng thử lại sau giây lát!", "error");
        return;
    }
    
    if (isMusicPlaying) {
        ytPlayer.pauseVideo();
    } else {
        btn.innerHTML = '⏳ Đang tải...'; // Báo hiệu đang xử lý
        ytPlayer.playVideo();
    }
}

// --- WEB AUDIO API (Tạo tiếng "Ting!" không cần file ngoài) ---
const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        
        function playSuccessSound() {
            // Dùng âm thanh tiếng vỗ tay từ nguồn ổn định
            const audio = new Audio('https://upload.wikimedia.org/wikipedia/commons/f/f6/Crowd_applause.ogg');
            audio.play().catch(e => console.log("Lỗi phát âm thanh chúc mừng:", e));
        }

        function playErrorSound() {
            if (audioCtx.state === 'suspended') {
                audioCtx.resume();
            }
            const oscillator = audioCtx.createOscillator();
            const gainNode = audioCtx.createGain();
            
            oscillator.type = 'sawtooth';
            oscillator.frequency.setValueAtTime(150, audioCtx.currentTime); 
            
            gainNode.gain.setValueAtTime(0, audioCtx.currentTime);
            gainNode.gain.linearRampToValueAtTime(0.2, audioCtx.currentTime + 0.05);
            gainNode.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.3);
            
            oscillator.connect(gainNode);
            gainNode.connect(audioCtx.destination);
            
            oscillator.start();
            oscillator.stop(audioCtx.currentTime + 0.3);
        }

        // --- LOGIC GIAO DIỆN ---

        // Bắt sự kiện Enter ở ô input
        document.getElementById('answerInput').addEventListener('keypress', function (e) {
            if (e.key === 'Enter') {
                checkAnswer();
            }
        });

        // Khởi tạo trạng thái mặc định khi load trang
        window.onload = () => {
            loadFromLocalStorage();
            applySettings(true);
        };

        function loadFromLocalStorage() {
            const savedData = localStorage.getItem('geometryGameSettings');
            if (savedData) {
                try {
                    const data = JSON.parse(savedData);
                    document.getElementById('setupTriangles').value = data.triangles || DEFAULT_TRIANGLES;
                    document.getElementById('setupQuads').value = data.quads || DEFAULT_QUADS;
                    document.getElementById('gameImage').src = data.image || DEFAULT_IMAGE;
                } catch(e) {
                    console.error("Lỗi đọc dữ liệu đã lưu", e);
                    setDefaults();
                }
            } else {
                setDefaults();
            }
        }

        function setDefaults() {
            document.getElementById('setupTriangles').value = DEFAULT_TRIANGLES;
            document.getElementById('setupQuads').value = DEFAULT_QUADS;
            document.getElementById('gameImage').src = DEFAULT_IMAGE;
            document.getElementById('imageUpload').value = '';
        }

        function restoreDefaults() {
            localStorage.removeItem('geometryGameSettings');
            setDefaults();
            applySettings(false);
            closeSettings();
            showFeedback("Đã khôi phục bài toán gốc! 🔄", "success");
        }

        function openSettings() {
            document.getElementById('settingsModal').classList.remove('hidden');
        }

        function closeSettings() {
            document.getElementById('settingsModal').classList.add('hidden');
        }

        function saveSettings() {
            // Xử lý ảnh bài toán tải lên (nếu có)
            const imageFile = document.getElementById('imageUpload').files[0];
            if (imageFile) {
                const reader = new FileReader();
                reader.onload = function(e) {
                    document.getElementById('gameImage').src = e.target.result;
                    saveToLocalStorageAndApply();
                };
                reader.readAsDataURL(imageFile);
            } else {
                saveToLocalStorageAndApply();
            }
        }
        
        function saveToLocalStorageAndApply() {
            const dataToSave = {
                triangles: document.getElementById('setupTriangles').value,
                quads: document.getElementById('setupQuads').value,
                image: document.getElementById('gameImage').src
            };
            
            try {
                localStorage.setItem('geometryGameSettings', JSON.stringify(dataToSave));
            } catch(e) {
                console.error("Không thể lưu trữ (có thể do ảnh quá lớn): ", e);
                showFeedback("Lưu ý: Ảnh quá lớn, không thể tự động lưu cho lần sau.", "error");
            }
            
            applySettings(false);
            closeSettings();
        }

        function applySettings(isInitial = false) {
            // Reset dữ liệu nếu không phải lần chạy đầu tiên
            expectedAnswers = {};
            answerTypes = {};
            
            if (!isInitial) {
                foundAnswers.clear();
                document.getElementById('foundTrianglesList').innerHTML = '';
                document.getElementById('foundQuadsList').innerHTML = '';
                updateCounts();
                clearFeedback();
                document.getElementById('answerInput').value = '';
            }

            // Lấy dữ liệu giáo viên cài đặt
            const triInput = document.getElementById('setupTriangles').value;
            const quadInput = document.getElementById('setupQuads').value;

            // Xử lý Tam giác
            triInput.split(',').forEach(item => {
                const raw = item.trim().toUpperCase();
                if (raw) {
                    const norm = getCanonicalName(raw);
                    expectedAnswers[norm] = raw; // Lưu cách hiển thị đẹp nhất do GV nhập
                    answerTypes[norm] = 'triangle';
                }
            });

            // Xử lý Tứ giác
            quadInput.split(',').forEach(item => {
                const raw = item.trim().toUpperCase();
                if (raw) {
                    const norm = getCanonicalName(raw);
                    expectedAnswers[norm] = raw;
                    answerTypes[norm] = 'quad';
                }
            });
            
            // Tự động focus vào ô trả lời sau khi cài đặt
            if (!isInitial) {
                setTimeout(() => document.getElementById('answerInput').focus(), 100);
            }
        }

        function checkAnswer() {
            const inputEl = document.getElementById('answerInput');
            const rawInput = inputEl.value.trim().toUpperCase();
            if (!rawInput) return;

            const normalizedInput = getCanonicalName(rawInput);

            if (expectedAnswers[normalizedInput]) {
                // Kiểm tra xem đã tìm thấy chưa
                if (foundAnswers.has(normalizedInput)) {
                    showFeedback('Hình này đã được tìm thấy rồi!', 'error');
                } else {
                    // Trả lời ĐÚNG và MỚI
                    foundAnswers.add(normalizedInput);
                    
                    const displayStr = expectedAnswers[normalizedInput];
                    const type = answerTypes[normalizedInput];
                    
                    addBadgeToList(displayStr, type);
                    updateCounts();
                    showFeedback(`Chính xác rồi! 🎉 Hình ${displayStr}`, 'success');
                    
                    playSuccessSound();
                    
                    // Hiệu ứng pháo giấy
                    confetti({
                        particleCount: 100,
                        spread: 70,
                        origin: { y: 0.6 },
                        colors: ['#38bdf8', '#fbbf24', '#34d399', '#f472b6']
                    });
                    
                    // Xóa input nếu đúng
                    inputEl.value = '';
                }
            } else {
                // Trả lời SAI
                showFeedback('Chưa đúng, thử lại nhé!', 'error');
            }
            
            // Focus lại ô input sau khi click
            inputEl.focus();
        }

        function addBadgeToList(text, type) {
            const badge = document.createElement('div');
            badge.className = 'pop-animation text-lg font-bold px-4 py-2 rounded-xl shadow-sm border-2';
            badge.textContent = text;
            
            if (type === 'triangle') {
                badge.classList.add('bg-white', 'text-amber-600', 'border-amber-300');
                document.getElementById('foundTrianglesList').appendChild(badge);
            } else {
                badge.classList.add('bg-white', 'text-emerald-600', 'border-emerald-300');
                document.getElementById('foundQuadsList').appendChild(badge);
            }
        }

        function updateCounts() {
            let tCount = 0;
            let qCount = 0;
            foundAnswers.forEach(ans => {
                if (answerTypes[ans] === 'triangle') tCount++;
                if (answerTypes[ans] === 'quad') qCount++;
            });
            document.getElementById('countTriangles').textContent = tCount;
            document.getElementById('countQuads').textContent = qCount;
        }

        let feedbackTimeout;
        function showFeedback(message, type) {
            const fb = document.getElementById('feedbackArea');
            clearTimeout(feedbackTimeout);
            
            // Xóa animation cũ để trigger lại
            fb.classList.remove('pop-animation', 'shake-animation');
            void fb.offsetWidth; // trigger reflow
            
            if (type === 'success') {
                fb.innerHTML = `<div class="bg-green-100 border-4 border-green-400 text-green-700 px-8 py-3 rounded-2xl text-2xl font-black shadow-lg pop-animation">${message}</div>`;
            } else {
                playErrorSound();
                fb.innerHTML = `<div class="bg-red-50 border-4 border-red-300 text-red-500 px-6 py-2 rounded-xl text-xl font-bold shadow-md shake-animation">${message}</div>`;
                document.getElementById('answerInput').classList.add('shake-animation');
                setTimeout(() => document.getElementById('answerInput').classList.remove('shake-animation'), 400);
            }

            feedbackTimeout = setTimeout(clearFeedback, 3000);
        }

        function clearFeedback() {
            document.getElementById('feedbackArea').innerHTML = '';
        }

    </script>
</body>
</html>
